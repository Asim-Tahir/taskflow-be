info:
  name: List and filter tasks
  type: http
  seq: 1
  tags:
    - Tasks

http:
  method: GET
  url: "{{baseUrl}}/tasks"
  params:
    - name: title
      value: ""
      type: query
      disabled: true
    - name: description
      value: ""
      type: query
      disabled: true
    - name: status
      value: pending
      type: query
      disabled: true
    - name: status
      value: completed
      type: query
      disabled: true
    - name: priority
      value: low
      type: query
      disabled: true
    - name: priority
      value: medium
      type: query
      disabled: true
    - name: priority
      value: high
      type: query
      disabled: true
    - name: assignee
      value: ""
      type: query
      disabled: true
    - name: sort
      value: title
      type: query
      disabled: true
    - name: sort
      value: description
      type: query
      disabled: true
    - name: sort
      value: status
      type: query
      disabled: true
    - name: sort
      value: priority
      type: query
      disabled: true
    - name: sort
      value: assignee
      type: query
      disabled: true
    - name: sort
      value: createdAt
      type: query
      disabled: true
    - name: sort
      value: updatedAt
      type: query
      disabled: true
    - name: order
      value: asc
      type: query
    - name: order
      value: desc
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
      description: Currently rejected as a string by query validation.
    - name: limit
      value: "10"
      type: query
      description: Currently rejected as a string by query validation.
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

