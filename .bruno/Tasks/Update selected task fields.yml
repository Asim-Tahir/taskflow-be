info:
  name: Update selected task fields
  type: http
  seq: 6
  tags:
    - Tasks

http:
  method: PATCH
  url: "{{baseUrl}}/tasks/:id"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "status": "completed",
        "assignee": "jordan-mitchell"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: A completed task (Complete and assign a task)
    request:
      url: "{{baseUrl}}/tasks/:id"
      method: PATCH
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "status": "completed",
            "assignee": "jordan-mitchell"
          }
    response:
      status: 200
      statusText: OK
      headers:
